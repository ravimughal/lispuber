services:
  pgserver:
    image: postgres:latest
    container_name: pgserver
    volumes:
      - postgres-data:/var/lib/postgresql-data
    networks:
      - dbnet
    expose:
      - 5432
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=ptir_user
      - POSTGRES_PASSWORD=ptir_password
      - POSTGRES_DB=ptir_db
    restart: unless-stopped

  # APP*****************************************
  webtaxi:
    image: webtaxi:latest
    build:
      context: .
    container_name: webtaxi
    environment:
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - dbnet
    expose:
      - 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - pgserver

volumes:
  postgres-data:

networks:
  dbnet:
    driver: bridge
