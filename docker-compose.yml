services:
  pgserver:
    image: postgres:latest
    container_name: pgserver
    volumes:
      - postgres-data:/var/lib/postgresql-data
    expose:
      - 5432
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    restart: unless-stopped

  # APP*****************************************
  webtaxi:
    image: webtaxi:latest
    build:
      context: .
    container_name: webtaxi
    expose:
      - 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - pgserver

volumes:
  postgres-data:


