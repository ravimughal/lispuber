<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile — DASH</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif'],display:['Sora','sans-serif']}}}}</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .sora{font-family:'Sora',sans-serif}
  header,nav,button,a{transition:background-color .2s,border-color .18s,color .15s}
  #toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(40px);opacity:0;background:#0f172a;color:#f8fafc;padding:7px 18px;border-radius:99px;font-size:12px;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .25s}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .dark #toast{background:#f1f5f9;color:#0f172a}
  .scroll-area{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#e2e8f0 transparent}
  .dark .scroll-area{scrollbar-color:#334155 transparent}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<div id="toast"></div>

<!-- TOP BAR -->
<header class="flex items-center justify-between bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-4 z-20 flex-shrink-0" style="height:54px">
  <a href="../info/index.html" class="flex items-center gap-2 no-underline">
    <div class="w-7 h-7 rounded-lg bg-sky-500 flex items-center justify-center text-white text-xs font-bold sora">D</div>
    <span class="sora font-semibold text-slate-900 dark:text-white text-sm">DASH</span>
  </a>
  <div class="flex items-center gap-2">
    <button id="theme-btn" onclick="toggleTheme()" class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-base hover:border-sky-400">🌙</button>
    <button onclick="toast('✏️ Edit mode')" class="sora text-xs font-semibold text-sky-500 px-3 py-1.5 rounded-lg border border-sky-200 dark:border-sky-800 hover:bg-sky-50 dark:hover:bg-sky-950/30">Edit</button>
  </div>
</header>

<!-- CONTENT -->
<div class="scroll-area px-4 py-5">

  <div class="text-center mb-5">
    <div class="w-16 h-16 rounded-full bg-sky-50 dark:bg-sky-950/50 border-2 border-sky-300 dark:border-sky-700 flex items-center justify-center text-3xl mx-auto mb-3">👤</div>
    <div class="sora font-bold text-lg text-slate-900 dark:text-white">Alex Rivera</div>
    <div class="text-xs text-slate-400 mt-0.5">alex.rivera@email.com</div>
    <div class="flex items-center justify-center gap-1.5 mt-1.5"><span class="text-sky-400 text-xs">★★★★★</span><span class="text-xs text-slate-400">4.9 · 47 rides</span></div>
  </div>

  <div class="grid grid-cols-3 gap-2 mb-5">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-center">
      <div class="sora font-bold text-xl text-sky-500">47</div><div class="text-[10px] text-slate-400 mt-0.5">Rides</div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-center">
      <div class="sora font-bold text-xl text-sky-500">€284</div><div class="text-[10px] text-slate-400 mt-0.5">Spent</div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-center">
      <div class="sora font-bold text-xl text-sky-500">€5</div><div class="text-[10px] text-slate-400 mt-0.5">Credits</div>
    </div>
  </div>

  <p class="sora text-[10px] font-semibold tracking-widest uppercase text-slate-400 mb-2">Account</p>
  <div class="space-y-1.5 mb-5">
    <button onclick="toast('💳 Payment methods')" class="w-full flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-left hover:border-sky-300 dark:hover:border-sky-700">
      <div class="w-8 h-8 rounded-lg bg-sky-50 dark:bg-sky-950/50 border border-sky-100 dark:border-sky-800 flex items-center justify-center text-sm flex-shrink-0">💳</div>
      <div class="flex-1"><div class="sora font-semibold text-sm text-slate-900 dark:text-white">Payment methods</div><div class="text-xs text-slate-400">Visa ···· 4821</div></div>
      <span class="text-slate-300 dark:text-slate-600 text-sm">›</span>
    </button>
    <button onclick="toast('📍 Saved places')" class="w-full flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-left hover:border-sky-300 dark:hover:border-sky-700">
      <div class="w-8 h-8 rounded-lg bg-sky-50 dark:bg-sky-950/50 border border-sky-100 dark:border-sky-800 flex items-center justify-center text-sm flex-shrink-0">📍</div>
      <div class="flex-1"><div class="sora font-semibold text-sm text-slate-900 dark:text-white">Saved places</div><div class="text-xs text-slate-400">Home, Work, +2 more</div></div>
      <span class="text-slate-300 dark:text-slate-600 text-sm">›</span>
    </button>
    <button onclick="toast('🎁 Referral link copied!')" class="w-full flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-left hover:border-sky-300 dark:hover:border-sky-700">
      <div class="w-8 h-8 rounded-lg bg-sky-50 dark:bg-sky-950/50 border border-sky-100 dark:border-sky-800 flex items-center justify-center text-sm flex-shrink-0">🎁</div>
      <div class="flex-1"><div class="sora font-semibold text-sm text-slate-900 dark:text-white">Refer a friend</div><div class="text-xs text-slate-400">Earn €5 per referral</div></div>
      <span class="sora text-[9px] font-bold bg-sky-500 text-white px-1.5 py-0.5 rounded-full">NEW</span>
    </button>
  </div>

  <p class="sora text-[10px] font-semibold tracking-widest uppercase text-slate-400 mb-2">Support</p>
  <div class="space-y-1.5 mb-5">
    <button onclick="toast('🆘 Support opened')" class="w-full flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-left hover:border-sky-300 dark:hover:border-sky-700">
      <div class="w-8 h-8 rounded-lg bg-sky-50 dark:bg-sky-950/50 border border-sky-100 dark:border-sky-800 flex items-center justify-center text-sm flex-shrink-0">🆘</div>
      <div class="flex-1"><div class="sora font-semibold text-sm text-slate-900 dark:text-white">Help & Support</div></div>
      <span class="text-slate-300 dark:text-slate-600 text-sm">›</span>
    </button>
    <button onclick="toast('🔒 Privacy settings')" class="w-full flex items-center gap-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-3 text-left hover:border-sky-300 dark:hover:border-sky-700">
      <div class="w-8 h-8 rounded-lg bg-sky-50 dark:bg-sky-950/50 border border-sky-100 dark:border-sky-800 flex items-center justify-center text-sm flex-shrink-0">🔒</div>
      <div class="flex-1"><div class="sora font-semibold text-sm text-slate-900 dark:text-white">Privacy & Security</div></div>
      <span class="text-slate-300 dark:text-slate-600 text-sm">›</span>
    </button>
  </div>

  <button onclick="window.location.href='../info/index.html'" class="w-full py-3 rounded-xl border border-red-200 dark:border-red-900/40 text-sm font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-950/20 bg-white dark:bg-slate-800 mb-4">Sign out</button>
</div>

<!-- BOTTOM NAV -->
<nav class="flex-shrink-0 grid grid-cols-3 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 z-20" style="height:56px">
  <a href="index.html"    class="flex flex-col items-center justify-center gap-0.5 text-slate-400 hover:text-sky-500 no-underline">
    <span class="text-xl leading-none">🏠</span><span class="sora text-[9px] font-semibold tracking-wider uppercase">Home</span>
  </a>
  <a href="activity.html" class="flex flex-col items-center justify-center gap-0.5 text-slate-400 hover:text-sky-500 no-underline">
    <span class="text-xl leading-none">📋</span><span class="sora text-[9px] font-semibold tracking-wider uppercase">Activity</span>
  </a>
  <a href="profile.html"  class="flex flex-col items-center justify-center gap-0.5 text-sky-500 no-underline">
    <span class="text-xl leading-none">👤</span><span class="sora text-[9px] font-semibold tracking-wider uppercase">Profile</span>
  </a>
</nav>

<script>
function applyTheme(t){document.documentElement.classList.toggle('dark',t==='dark');document.getElementById('theme-btn').textContent=t==='dark'?'☀️':'🌙';}
function toggleTheme(){var t=localStorage.getItem('dash-theme')==='dark'?'light':'dark';localStorage.setItem('dash-theme',t);applyTheme(t);}
applyTheme(localStorage.getItem('dash-theme')||'light');
var _toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(function(){el.classList.remove('show');},2500);}
</script>
</body>
</html>
