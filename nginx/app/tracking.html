<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DASH — Ride in Progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif'],display:['Sora','sans-serif']}}}}</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3,.sora{font-family:'Sora',sans-serif}
  header,nav,.sheet,button,a{transition:background-color .2s,border-color .18s,color .15s}
  #map{position:absolute;inset:0;z-index:0}
  .leaflet-control-attribution{display:none!important}
  .leaflet-control-zoom{border-radius:10px!important;overflow:hidden;border:1px solid #e2e8f0!important}
  .dark .leaflet-control-zoom{border-color:#334155!important}
  .leaflet-control-zoom a{width:30px!important;height:30px!important;line-height:30px!important;font-size:16px!important;background:#fff!important;color:#374151!important}
  .dark .leaflet-control-zoom a{background:#1e293b!important;color:#e2e8f0!important}
  #toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(40px);opacity:0;background:#0f172a;color:#f8fafc;padding:7px 18px;border-radius:99px;font-size:12px;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .25s}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .dark #toast{background:#f1f5f9;color:#0f172a}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}} .blink{animation:blink 1.6s ease-in-out infinite}
</style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<div id="toast"></div>

<!-- TOP BAR -->
<header class="flex items-center justify-between bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-4 z-20 flex-shrink-0" style="height:54px">
  <div class="flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-emerald-400 blink inline-block"></span>
    <span class="sora font-semibold text-sm text-slate-900 dark:text-white">Ride in progress</span>
  </div>
  <div class="flex items-center gap-2">
    <button id="theme-btn" onclick="toggleTheme()" class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-base hover:border-sky-400">🌙</button>
    <button onclick="cancelRide()" class="text-xs text-slate-400 hover:text-red-500 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-red-300">Cancel ✕</button>
  </div>
</header>

<!-- MAP AREA -->
<div class="flex-1 relative">
  <div id="map"></div>

  <!-- ETA badge -->
  <div class="absolute top-3 left-1/2 -translate-x-1/2 z-10 bg-white/95 dark:bg-slate-800/95 backdrop-blur border border-slate-200 dark:border-slate-700 rounded-full px-4 py-1.5 text-xs font-semibold flex items-center gap-2 shadow-lg whitespace-nowrap sora">
    🕐 <span id="eta-text">Locating driver…</span>
  </div>

  <!-- SHEET -->
  <div class="absolute bottom-0 left-0 right-0 z-10 bg-white dark:bg-slate-900 rounded-t-2xl border-t border-slate-100 dark:border-slate-800" style="box-shadow:0 -4px 24px rgba(0,0,0,.1)">
    <div class="w-10 h-1 rounded-full bg-slate-200 dark:bg-slate-700 mx-auto mt-3 mb-1"></div>
    <div class="px-4 pb-5 pt-2">

      <!-- Driver row -->
      <div class="flex items-center gap-3 mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="w-11 h-11 rounded-full bg-sky-50 dark:bg-sky-950/40 border-2 border-sky-200 dark:border-sky-800 flex items-center justify-center text-2xl flex-shrink-0">👨</div>
        <div class="flex-1 min-w-0">
          <div class="sora font-semibold text-sm text-slate-900 dark:text-white">Marcus Webb</div>
          <div class="text-xs text-slate-400 mt-0.5">Tesla Model 3 · <span class="text-slate-600 dark:text-slate-300 font-medium">AB-123-CD</span></div>
          <div class="flex items-center gap-1 mt-0.5"><span class="text-sky-400 text-xs">★★★★★</span><span class="text-xs text-slate-400">4.97</span></div>
        </div>
        <div class="flex gap-1.5 flex-shrink-0">
          <button onclick="toast('📞 Calling driver…')" class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-base hover:border-sky-400">📞</button>
          <button onclick="toast('💬 Chat opened')"     class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center text-base hover:border-sky-400">💬</button>
        </div>
      </div>

      <!-- Progress -->
      <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-3 mb-3 border border-slate-100 dark:border-slate-700">
        <div class="flex justify-between text-xs text-slate-400 mb-2">
          <span>Driver en route</span><span id="progress-label" class="font-medium">—</span>
        </div>
        <div class="h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="ride-progress" class="h-full bg-sky-500 rounded-full" style="width:8%;transition:width .5s ease"></div>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-3 text-center">
          <div><div class="text-[10px] text-slate-400">Pickup</div><div class="text-xs sora font-semibold text-sky-500 mt-0.5">~2 min</div></div>
          <div><div class="text-[10px] text-slate-400">To</div><div class="text-xs sora font-semibold text-slate-700 dark:text-slate-300 mt-0.5 truncate" id="dest-label">—</div></div>
          <div><div class="text-[10px] text-slate-400">Fare</div><div class="text-xs sora font-semibold text-slate-700 dark:text-slate-300 mt-0.5" id="fare-label">—</div></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="toast('📍 Location shared!')" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 hover:border-sky-400 hover:text-sky-500 bg-white dark:bg-slate-800">Share location</button>
        <button onclick="cancelRide()" class="py-2.5 rounded-xl border border-red-200 dark:border-red-900/40 text-xs font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-950/20 bg-white dark:bg-slate-800">Cancel ride</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="flex-shrink-0 grid grid-cols-3 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 z-20" style="height:56px">
  <a href="index.html"    class="flex flex-col items-center justify-center gap-0.5 text-slate-400 hover:text-sky-500 no-underline">
    <span class="text-xl leading-none">🏠</span>
    <span class="sora text-[9px] font-semibold tracking-wider uppercase">Home</span>
  </a>
  <a href="activity.html" class="flex flex-col items-center justify-center gap-0.5 text-slate-400 hover:text-sky-500 no-underline">
    <span class="text-xl leading-none">📋</span>
    <span class="sora text-[9px] font-semibold tracking-wider uppercase">Activity</span>
  </a>
  <a href="profile.html"  class="flex flex-col items-center justify-center gap-0.5 text-slate-400 hover:text-sky-500 no-underline">
    <span class="text-xl leading-none">👤</span>
    <span class="sora text-[9px] font-semibold tracking-wider uppercase">Profile</span>
  </a>
</nav>

<script>
function applyTheme(t){document.documentElement.classList.toggle('dark',t==='dark');document.getElementById('theme-btn').textContent=t==='dark'?'☀️':'🌙';}
function toggleTheme(){var t=localStorage.getItem('dash-theme')==='dark'?'light':'dark';localStorage.setItem('dash-theme',t);applyTheme(t);}
applyTheme(localStorage.getItem('dash-theme')||'light');

var _toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(function(){el.classList.remove('show');},2500);}

function pinIcon(color,label){
  return L.divIcon({className:'',html:'<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:'+color+';transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);color:#fff;font-weight:700;font-size:9px">'+label+'</span></div>',iconSize:[26,26],iconAnchor:[13,26]});
}
function carIcon(){
  return L.divIcon({className:'',html:'<div style="font-size:1.4rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))">🚗</div>',iconSize:[28,28],iconAnchor:[14,14]});
}

var map, driverMarker, trackInterval;

window.addEventListener('load',function(){
  var ride={};
  try{ride=JSON.parse(sessionStorage.getItem('activeRide')||'{}');}catch(e){}

  var pLat=ride.pickupLat||38.7223, pLng=ride.pickupLng||-9.1393;
  var dLat=ride.destLat||38.7523,   dLng=ride.destLng||-9.1593;

  document.getElementById('fare-label').textContent=ride.fare?'€'+ride.fare:'—';
  document.getElementById('dest-label').textContent=ride.dest?ride.dest.split(',')[0]:'—';

  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([pLat,pLng],14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true}).addTo(map);
  L.marker([pLat,pLng],{icon:pinIcon('#22c55e','A')}).addTo(map).bindPopup('Pickup');
  L.marker([dLat,dLng],{icon:pinIcon('#ef4444','B')}).addTo(map).bindPopup(ride.dest||'Destination');

  // Draw route
  var url='https://router.project-osrm.org/route/v1/driving/'+pLng+','+pLat+';'+dLng+','+dLat+'?overview=full&geometries=geojson';
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data.routes||!data.routes.length) return;
      var coords=data.routes[0].geometry.coordinates.map(function(c){return[c[1],c[0]];});
      var line=L.polyline(coords,{color:'#0ea5e9',weight:4,opacity:.8}).addTo(map);
      map.fitBounds(line.getBounds(),{padding:[80,80]});
      document.getElementById('progress-label').textContent=(data.routes[0].distance/1000).toFixed(1)+' km';
    }).catch(function(){document.getElementById('progress-label').textContent='—';});

  // Animate driver
  var drvLat=pLat-0.012, drvLng=pLng-0.01;
  driverMarker=L.marker([drvLat,drvLng],{icon:carIcon()}).addTo(map);
  var step=0, total=16;
  trackInterval=setInterval(function(){
    if(step>=total){clearInterval(trackInterval);document.getElementById('eta-text').textContent='Arrived!';return;}
    step++;
    var t=step/total, lat, lng;
    if(t<0.45){var tt=t/0.45;lat=drvLat+(pLat-drvLat)*tt;lng=drvLng+(pLng-drvLng)*tt;}
    else{var tt2=(t-0.45)/0.55;lat=pLat+(dLat-pLat)*tt2;lng=pLng+(dLng-pLng)*tt2;}
    driverMarker.setLatLng([lat,lng]);
    var rem=Math.max(0,Math.round((1-t)*14));
    document.getElementById('eta-text').textContent=rem>0?rem+' min away':'Arriving…';
    document.getElementById('ride-progress').style.width=Math.round(t*100)+'%';
  },2500);
});

function cancelRide(){
  clearInterval(trackInterval);
  toast('❌ Ride cancelled');
  setTimeout(function(){window.location.href='index.html';},600);
}
</script>
</body>
</html>
