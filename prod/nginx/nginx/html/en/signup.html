<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - LispUber</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">

  <script src="/js/main.js"></script>

  <script>
    tailwind.config={darkMode:'class',theme:{extend:{
      fontFamily:{sans:['DM Sans','sans-serif'],
      heading:['Sora','sans-serif']}
    }}};

  
    function setProgress(step, total) {
      const pct = Math.round((step / total) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('step-label').textContent = `Step ${step} of ${total}`;
      document.getElementById('step-pct').textContent = pct + '%';
    }
  
    function showStep(id) {
      setProgress(id, 2);

      document.getElementById("step-1").classList.add('hidden');
      document.getElementById("step-2").classList.add('hidden');
      document.getElementById("step-"+id).classList.remove('hidden');
    }

    function togglePass() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }
  
    async function submitForm() {
      if ((await create()) === false) return;

      showToast(isPt ? "Registro bem-sucedido" : "Registration successful");
      window.location.href = "user";
    }
  </script>
  
  <style>
    body{font-family:'DM Sans',sans-serif;} .font-heading,h1,h2,h3{font-family:'Sora',sans-serif;}
    *,*::before,*::after{transition:background-color .2s,border-color .2s,color .15s;}
    .step { display: none; }
    .step.active { display: block; }
    .role-card.selected { border-color: #20bcf5; background-color: rgba(32, 199, 245, 0.08); }
    .upload-box { border: 2px dashed rgba(255,255,255,0.12); transition: border-color 0.2s; cursor: pointer; }
    .upload-box:hover { border-color: #20bcf5; }
    input[type="file"] { display: none; }
    .progress-bar { transition: width 0.4s ease; }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col">
  <div id="toast"></div>
  <div id="enterBtn"></div>
  <div id="signinBtn"></div>

  <nav class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-5 h-14 flex items-center justify-between">
    <a href="index" class="px-2 py-1.5 rounded-lg flex items-center gap-2 font-heading font-semibold text-slate-900 dark:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
      <div class="w-7 h-7 rounded-lg bg-sky-500 flex items-center justify-center text-white text-xs font-bold">L</div>Lisp
    </a>
    <div class="flex items-center gap-2">
      <button onclick="Theme.toggle()" data-theme-icon class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-sm hover:bg-slate-100 dark:hover:bg-slate-800">🌙</button>
      <div class="relative">
        <button id="langToggle"
          class="text-sm px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
          EN ▾
        </button>

        <div id="langMenu"
          class="hidden absolute right-0 mt-2 w-24 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg overflow-hidden z-50">
          <button data-lang="en"
            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">
            English
          </button>
          <button data-lang="pt"
            class="w-full text-left px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">
            Português
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex-1 flex items-center justify-center p-5">
    <div class="w-full max-w-md">
      <div class="bg-slate-900 border border-white/[0.07] rounded-3xl shadow-2xl shadow-black/60 p-8">      
  
        <div class="mb-6" id="progress-wrap">
          <div class="flex justify-between text-xs text-slate-500 mb-2">
            <span id="step-label">Step 1 of 2</span>
            <span id="step-pct">50%</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-1.5">
            <div id="progress-bar" class="progress-bar h-1.5 rounded-full" style="width:50%; background:linear-gradient(90deg,#20abf5,#05b7f8);"></div>
          </div>
        </div>
  
        <div class="step active" id="step-1">
          <h1 class="font-heading font-bold text-xl text-white mb-4 text-center">Create your account</h1>
  
          <div class="grid grid-cols-1 gap-3 mb-6">
            <div class="selected role-card border border-white/10 rounded-2xl p-4 cursor-pointer text-center transition-all duration-200 hover:border-blue-400/50">
              <div class="text-3xl mb-2">🧍</div>
              <p class="font-semibold text-sm text-white">Rider</p>
            </div>
          </div>
    
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Full name</label>
              <input type="text" placeholder="Jane Doe" id="create-name" class="w-full px-3.5 py-2.5 rounded-xl border border-white/10 bg-slate-800 text-slate-100 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 placeholder-slate-500 transition" />
              <span id="create-name-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Email</label>
              <input type="text" placeholder="you@email.com" id="create-email" class="w-full px-3.5 py-2.5 rounded-xl border border-white/10 bg-slate-800 text-slate-100 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 placeholder-slate-500 transition" />
              <span id="create-email-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Date of birth</label>
              <input type="date" id="create-dateBirth" class="w-full px-3.5 py-2.5 rounded-xl border border-white/10 bg-slate-800 text-slate-400 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 transition" />
              <span id="create-dateBirth-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">NIF</label>
              <input type="text" placeholder="123456789" id="create-nif" class="w-full px-3.5 py-2.5 rounded-xl border border-white/10 bg-slate-800 text-slate-100 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 placeholder-slate-500 transition" />
              <span id="create-nif-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Gender</label>
              <select id="create-gender" class="w-full px-3.5 py-2.5 rounded-xl border border-white/10 bg-slate-800 text-slate-100 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 transition">
                <option value="MASCULINO" selected>Male</option>
                <option value="FEMININO">Female</option>
                <option value="NAO-INDICADO">Other</option>
              </select>
              <span id="create-gender-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                  Password
                </label>
                <div class="relative">
                  <input id="create-password" type="password" placeholder="••••••••"
                    onkeydown="if(event.key === 'Enter') showStep(2)"
                    required
                    class="w-full px-3.5 py-2.5 pr-12 rounded-xl border border-white/10 bg-slate-800 text-slate-100 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 placeholder-slate-500 transition" />
                  <button type="button"
                    onclick="toggleCreatePassword(event, 'create-password', 'toggle-create-pass-btn')"
                    id="toggle-create-pass-btn"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-500 hover:text-slate-200 transition px-2 py-1 rounded-md hover:bg-white/5">
                    Show
                  </button>
                </div>
                <span id="create-password-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
                  Confirm Password
                </label>
                <div class="relative">
                  <input id="confirm-password" type="password" placeholder="••••••••"
                    onkeydown="if(event.key === 'Enter') showStep(2)"
                    required
                    class="w-full px-3.5 py-2.5 pr-12 rounded-xl border border-white/10 bg-slate-800 text-slate-100 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/10 placeholder-slate-500 transition" />
                  <button type="button"
                    onclick="toggleCreatePassword(event, 'confirm-password', 'toggle-confirm-pass-btn')"
                    id="toggle-confirm-pass-btn"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-500 hover:text-slate-200 transition px-2 py-1 rounded-md hover:bg-white/5">
                    Show
                  </button>
                </div>
                <span id="confirm-password-error" class="text-red-500 text-xs mt-1 block">&nbsp;</span>
              </div>
            </div>
          </div>
          <button onclick="submitForm()" class="mt-5 w-full py-2.5 rounded-xl font-semibold text-sm text-slate-900 transition hover:opacity-90 active:scale-95" style="background:linear-gradient(90deg,#20bcf5,#05b7f8);">
            Continue →
          </button>
          <span id="create-error" class="text-red-500 text-xs mt-1 block text-center">&nbsp;</span>
          <p class="text-center text-sm text-slate-400 mt-5">
            Already have an account? <a href="signup" class="text-sky-500 hover:text-sky-600 font-medium">Sign in</a>
          </p>
        </div>
  


        <div class="step" id="step-2">
          <button onclick="showStep(1)" class="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-300 mb-5 transition">← Back</button>
          <h1 class="font-heading font-bold text-xl text-white mb-1">Almost there! 🎉</h1>
          <p class="text-sm text-slate-400 mb-6">Review and accept to start riding.</p>
          <div class="bg-slate-800/50 border border-white/5 rounded-2xl p-4 space-y-2.5 mb-5">
            <div class="flex items-center gap-2 text-sm">
              <span class="text-xl">🧍</span>
              <div><p class="text-white font-medium">Rider account</p><p class="text-slate-500 text-xs">Personal use</p></div>
            </div>
            <div class="border-t border-white/5 pt-2.5 space-y-1.5 text-xs text-slate-400">
              <div class="flex justify-between"><span>Safety rating visible to drivers</span><span class="text-green-400">✓</span></div>
              <div class="flex justify-between"><span>Real-time trip tracking</span><span class="text-green-400">✓</span></div>
              <div class="flex justify-between"><span>In-app payments</span><span class="text-green-400">✓</span></div>
            </div>
          </div>
          <label class="flex items-start gap-3 cursor-pointer mb-3">
            <input type="checkbox" class="mt-0.5 accent-blue-400 w-4 h-4 rounded" />
            <span class="text-xs text-slate-400">I agree to the Terms of Service and Privacy Policy</span>
          </label>
          <button onclick="submitForm()" class="w-full py-2.5 rounded-xl font-semibold text-sm text-slate-900 transition hover:opacity-90 active:scale-95" style="background:linear-gradient(90deg,#20bcf5,#05b7f8);">Create Rider Account</button>
        </div>
      </div>

      <p class="text-center mt-4">
        <a href="index" class="text-xs text-slate-400 hover:text-sky-500">← Back to home</a>
      </p>
    </div>
  </div>
</body>
</html>
