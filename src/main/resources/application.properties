spring.application.name=webtaxi

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://pgserver:5432/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Default session timeout (in seconds)
server.servlet.session.timeout=100000

# Enable JDBC session (if using JDBC)
# spring.session.store-type=jdbc

# Configure session cookie
server.servlet.session.cookie.name=MY_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true